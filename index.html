<!doctype html>
<html lang="it">
<head>
<link rel="apple-touch-icon" href="icona.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="demo-run.js"></script>

<base target="_top">
<meta charset="utf-8">
<style>
:root{--bg:#f6f3ee;--panel:#fff;--ink:#23201c;--muted:#6f675d;--line:#e2dbd0;--accent:#b8431f;--accent-ink:#fff;--soft:#f6e4dc;--err:#a3201a;--errbg:#fbe9e7;--warn:#8a5a00;--ok:#2f6b2f}
@media (prefers-color-scheme:dark){:root{--bg:#191714;--panel:#24211d;--ink:#f1ece4;--muted:#a89f93;--line:#3a352e;--accent:#e2673d;--accent-ink:#1b120e;--soft:#3a261d;--err:#ffb4ab;--errbg:#3d1f1c;--warn:#f0c060;--ok:#8fd18f}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
#app{height:100dvh;max-width:820px;margin:auto;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:12px 16px 0;padding-top:max(12px,env(safe-area-inset-top))}
.logo{width:34px;height:34px;flex:none}
h1{font-size:18px;margin:0;line-height:1.2}
header small{color:var(--muted);font-size:12px;display:block}
header .space{flex:1}
.gear{background:none;border:1px solid var(--line);border-radius:10px;padding:6px 10px;cursor:pointer;color:var(--muted);font-size:14px;white-space:nowrap}
.gear[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 16px 0;border-bottom:1px solid var(--line);scrollbar-width:thin}
nav button{flex:none;background:none;border:1px solid transparent;border-bottom:0;border-radius:10px 10px 0 0;padding:7px 14px;cursor:pointer;color:var(--muted);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav button[aria-selected=true]{background:var(--panel);border-color:var(--line);color:var(--ink);font-weight:600;margin-bottom:-1px}
nav button.new{color:var(--accent);font-weight:600}
#view{flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h2{font-size:18px;margin:0 0 4px}
.muted{color:var(--muted);font-size:14px;margin:0}
label.field{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
input[type=text],input[type=password]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:16px}
.drop{display:block;border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;cursor:pointer;color:var(--muted);margin-top:12px}
.drop strong{color:var(--accent)}
.drop.over{border-color:var(--accent);background:var(--soft)}
.types{font-size:12px;color:var(--muted);margin-top:4px}
.camera{display:inline-block;margin-top:8px;font-size:14px;color:var(--accent);cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:6px 12px;background:var(--panel)}
.files{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:6px}
.files li{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:14px;background:var(--panel)}
.files li .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.files li .n a{color:inherit}
.files li .s{color:var(--muted);font-size:13px;text-align:right}
.files li.warn .s{color:var(--warn)}
.files li.bad .s{color:var(--err)}
.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:2px 6px;border-radius:6px}
.x:hover{color:var(--err)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.danger{color:var(--err)}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:10px 18px;font-weight:600;cursor:pointer}
.primary:disabled,.btn:disabled{opacity:.5;cursor:default}
.progress{font-size:14px;color:var(--muted);margin:10px 0 0;min-height:1.5em}
.okmsg{color:var(--ok)}
.locked{border:1px dashed var(--line);border-radius:14px;padding:16px;color:var(--muted);font-size:14px}
.locked strong{color:var(--ink);display:block;margin-bottom:2px}
.archive-bar{padding:12px 16px;border-bottom:1px solid var(--line)}
.archive-bar h2{font-size:18px;margin:0;overflow-wrap:anywhere}
details{margin-top:8px}
summary{cursor:pointer;color:var(--accent);font-size:14px;font-weight:600}
details .inner{max-height:42vh;overflow-y:auto;padding:4px 2px 2px}
.rename{display:flex;gap:8px;margin-top:12px}
.rename input{flex:1}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.msg{max-width:92%;padding:10px 14px;border-radius:14px;overflow-wrap:anywhere}
.user{align-self:flex-end;background:var(--accent);color:var(--accent-ink);white-space:pre-wrap}
.bot{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}
.bot p,.bot ul,.bot ol{margin:0 0 8px}.bot>:last-child{margin-bottom:0}.bot ul,.bot ol{padding-left:22px}
.bot h3{font-size:16px;margin:8px 0 4px}
.cite{display:inline-block;font-size:12px;line-height:1.5;padding:0 7px;border-radius:9px;background:var(--soft);color:var(--ink);text-decoration:none;white-space:nowrap}
.err{align-self:flex-start;background:var(--errbg);color:var(--err);border-radius:14px;padding:10px 14px;max-width:92%}
.err button{display:block;margin-top:6px;font-size:14px;color:inherit;background:none;border:1px solid currentColor;border-radius:8px;padding:3px 9px;cursor:pointer}
.wait{color:var(--muted);font-style:italic}
.welcome h3{font-size:19px;line-height:1.25;margin:4px 0}
.welcome p{color:var(--muted);margin:0 0 12px}
.chips{display:grid;gap:8px}
.chips button{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;font-size:15px}
.chips button:hover{border-color:var(--accent)}
form.ask{display:flex;gap:8px;padding:10px 16px;padding-bottom:max(10px,env(safe-area-inset-bottom));border-top:1px solid var(--line)}
textarea{flex:1;font-size:16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 12px;resize:none;max-height:130px}
input:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible,summary:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.send{font-weight:600;background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:0 16px;cursor:pointer}
.send:disabled{opacity:.5;cursor:default}
.loading{padding:24px 16px;color:var(--muted)}
</style>
<title>Archivi AI</title></head>
<body>
<div id="app">
  <header>
    <svg class="logo" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="112" fill="#b8431f"/><rect x="88" y="118" width="336" height="76" rx="18" fill="#fff6ef"/><path d="M112 206h288v170a30 30 0 0 1-30 30H142a30 30 0 0 1-30-30z" fill="#fff6ef"/><rect x="206" y="250" width="100" height="34" rx="17" fill="#b8431f"/><rect x="150" y="84" width="140" height="44" rx="8" fill="#ffd9b3" transform="rotate(-6 220 106)"/><rect x="236" y="78" width="130" height="50" rx="8" fill="#ffe9d1" transform="rotate(5 300 103)"/><path d="M420 40c5 30 16 41 46 46-30 5-41 16-46 46-5-30-16-41-46-46 30-5 41-16 46-46z" fill="#fff"/></svg>
    <div><h1>Archivi AI</h1><small>Carica documenti, dai un nome all'archivio e fai domande</small></div>

<script>
window.addEventListener("error", function (e) { var v = document.getElementById("view"); if (v) v.textContent = "Errore della pagina: " + e.message + " (riga " + e.lineno + ":" + e.colno + ")"; });
</script>
<script>
(() => {
const NEW = "nuovo", SETTINGS = "impostazioni";
const MAX_UPLOAD = 20 * 1048576;
const SUGGESTED = ["Di cosa parlano questi documenti?", "Fammi un riassunto dei punti principali",
  "Ci sono avvertenze di sicurezza importanti?", "Quali scadenze o manutenzioni sono indicate?"];
const CALDAIA_SUGGESTED = ["Il display mostra E01: cosa devo fare?", "La pressione è bassa: come la ripristino?",
  "Come imposto il programma settimanale del termostato?", "Come regolo la temperatura dell'acqua calda?"];
const UNIT = {p: "p.", parte: "parte ", foglio: "foglio ", diapositiva: "slide "};
let archives = [], current = NEW, busy = false, picked = [], settings = {hasKey: true, model: ""};
const view = document.getElementById("view"), tabs = document.getElementById("tabs"), gear = document.getElementById("gear");

const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
const chatKey = id => "archivi-chat-" + id;
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function el(tag, attrs = {}, text) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k === "class" ? e.className = v : e.setAttribute(k, v);
  if (text !== undefined) e.textContent = text;
  return e;
}
function size(bytes) { return bytes > 1048576 ? (bytes / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(bytes / 1024)) + " KB"; }
function docUrl(f) { return f.id ? "https:" + "//drive.google.com/file/d/" + encodeURIComponent(f.id) + "/view" : null; }

// Chiamata al server Apps Script.
function run(name, ...args) {
  return new Promise((resolve, reject) => {
    window.__run.withSuccessHandler(res => { if (res && res.archivi) archives = res.archivi; resolve(res); })
      .withFailureHandler(e => {
        let m = String((e && e.message) || e || "Errore").replace(/^(Exception|Error|Errore):\s*/i, "");
        if (/NetworkError|network/i.test(m)) m = "Connessione assente: controlla Internet e riprova.";
        reject(new Error(m));
      }).api(name, args);
  });
}

// ---------- lettura dei documenti nel browser ----------
const EXT = s => ((s.match(/\.([a-z0-9]+)$/i) || [])[1] || "").toLowerCase();
const MIME_BY_EXT = {pdf: "application/pdf", jpg: "image/jpeg", jpeg: "image/jpeg", png: "image/png", webp: "image/webp", heic: "image/heic", heif: "image/heif",
  mp3: "audio/mp3", wav: "audio/wav", aac: "audio/aac", ogg: "audio/ogg", flac: "audio/flac", m4a: "audio/aac", opus: "audio/ogg", aiff: "audio/aiff",
  mp4: "video/mp4", mov: "video/mov", webm: "video/webm", mpeg: "video/mpeg", avi: "video/avi", "3gp": "video/3gpp",
  doc: "application/msword", xls: "application/vnd.ms-excel", ppt: "application/vnd.ms-powerpoint", rtf: "application/rtf",
  docx: "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
  xlsx: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
  pptx: "application/vnd.openxmlformats-officedocument.presentationml.presentation",
  odt: "application/vnd.oasis.opendocument.text", ods: "application/vnd.oasis.opendocument.spreadsheet", odp: "application/vnd.oasis.opendocument.presentation",
  txt: "text/plain", md: "text/markdown", csv: "text/csv", html: "text/html", htm: "text/html", json: "application/json", xml: "text/xml", epub: "application/epub+zip"};
const GEMINI_IMAGES = ["image/png", "image/jpeg", "image/webp", "image/heic", "image/heif"];
function kindOf(f) {
  const ext = EXT(f.name), t = (f.type || "").toLowerCase();
  if (ext === "pdf" || t === "application/pdf") return "pdf";
  if (["docx", "docm", "dotx"].includes(ext)) return "docx";
  if (["pptx", "ppsx", "potx"].includes(ext)) return "pptx";
  if (["xlsx", "xlsm", "xltx"].includes(ext)) return "xlsx";
  if (["odt", "ott", "odp", "ods"].includes(ext)) return ext === "odp" ? "odp" : ext === "ods" ? "ods" : "odt";
  if (ext === "epub") return "epub";
  if (["html", "htm", "xhtml"].includes(ext) || t === "text/html") return "html";
  if (t.startsWith("image/") || ["jpg", "jpeg", "png", "webp", "heic", "heif", "gif", "bmp", "tif", "tiff", "avif"].includes(ext)) return "image";
  if (t.startsWith("audio/") || ["mp3", "m4a", "wav", "aac", "ogg", "flac", "opus", "aiff"].includes(ext)) return "audio";
  if (t.startsWith("video/") || ["mp4", "mov", "webm", "mpeg", "mpg", "avi", "3gp", "m4v"].includes(ext)) return "video";
  if (["doc", "dot", "xls", "ppt", "pps", "rtf", "wpd", "sxw"].includes(ext)) return "convert";
  if (t.startsWith("text/") || ["txt", "md", "csv", "tsv", "json", "xml", "log", "yaml", "yml", "ini", "srt", "vtt", "eml", "tex", "sql"].includes(ext)) return "text";
  return "unknown";
}
function mimeOf(f) {
  const t = (f.type || "").toLowerCase(), ext = EXT(f.name);
  if (t === "audio/x-m4a" || t === "audio/m4a" || t === "audio/mp4") return "audio/aac";
  if (t === "video/quicktime") return "video/mov";
  return MIME_BY_EXT[ext] || t || "application/octet-stream";
}
function chunk(text, unit = "parte") {
  const out = []; let cur = "";
  for (const s of String(text).split(/\n(?=\S)/)) {
    if (cur && cur.length + s.length > 4000) { out.push({p: out.length + 1, t: cur}); cur = ""; }
    cur += (cur ? "\n" : "") + s;
  }
  if (cur.trim()) out.push({p: out.length + 1, t: cur});
  return {pages: out, unit};
}
function clean(t) { return t.replace(/[ \t]+/g, " ").replace(/ *\n */g, "\n").replace(/\n{3,}/g, "\n\n").trim(); }
function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("Libreria non caricata: controlla Internet.")); document.head.appendChild(s); });
}
let pdfjs = null, zipLoaded = null;
async function loadPdfjs() {
  if (!pdfjs) {
    const base = "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/legacy/build/";
    const lib = await import(base + "pdf.min.mjs");
    try {
      const code = await (await fetch(base + "pdf.worker.min.mjs")).text();
      lib.GlobalWorkerOptions.workerPort = new Worker(URL.createObjectURL(new Blob([code], {type: "text/javascript"})), {type: "module"});
    } catch (e) { lib.GlobalWorkerOptions.workerSrc = base + "pdf.worker.min.mjs"; }
    pdfjs = lib;
  }
  return pdfjs;
}
async function zip(file) {
  if (!zipLoaded) zipLoaded = loadScript("https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js");
  await zipLoaded;
  return JSZip.loadAsync(await file.arrayBuffer());
}
const xml = s => new DOMParser().parseFromString(s, "application/xml");
const byName = (node, name) => [...node.getElementsByTagName("*")].filter(e => e.localName === name);
async function readText(f, z, path) { const e = z.file(path); return e ? e.async("string") : null; }
function htmlToText(html) {
  const d = new DOMParser().parseFromString(String(html).replace(/<(br|\/p|\/div|\/h\d|\/li|\/tr|\/td|\/th)\b[^>]*>/gi, m => m + "\n"), "text/html");
  d.querySelectorAll("script,style,noscript").forEach(n => n.remove());
  return clean((d.body || d.documentElement).textContent || "");
}
const extractors = {
  async pdf(f, step) {
    const lib = await loadPdfjs();
    let doc;
    try { doc = await lib.getDocument({data: new Uint8Array(await f.arrayBuffer()), isEvalSupported: false}).promise; }
    catch (e) { if (e && e.name === "PasswordException") throw new Error("PDF protetto da password"); return null; }
    const pages = [];
    for (let i = 1; i <= doc.numPages; i++) {
      const page = await doc.getPage(i), tc = await page.getTextContent();
      let t = ""; for (const it of tc.items) if ("str" in it) t += it.str + (it.hasEOL ? "\n" : " ");
      pages.push({p: i, t: clean(t)}); page.cleanup(); step(`pagina ${i}/${doc.numPages}`);
    }
    const total = doc.numPages; await doc.destroy();
    const chars = pages.reduce((n, p) => n + p.t.length, 0);
    if (chars < 40 * total) return null;  // scansione: la legge l'AI
    return {pages, unit: "p", total};
  },
  async docx(f) {
    const z = await zip(f), d = xml(await readText(f, z, "word/document.xml") || "");
    let text = "", breaks = 0;
    for (const p of byName(d, "p")) {
      for (const e of p.getElementsByTagName("*")) {
        const n = e.localName;
        if (n === "t") text += e.textContent;
        else if (n === "tab") text += "\t";
        else if (n === "br") { if ((e.getAttribute("w:type") || "") === "page") { text += "\f"; breaks++; } else text += "\n"; }
        else if (n === "lastRenderedPageBreak") { text += "\f"; breaks++; }
      }
      text += "\n";
    }
    if (breaks) return {pages: text.split("\f").map((t, i) => ({p: i + 1, t: clean(t)})), unit: "p"};
    return chunk(clean(text));
  },
  async pptx(f) {
    const z = await zip(f);
    const slides = Object.keys(z.files).filter(n => /^ppt\/slides\/slide\d+\.xml$/.test(n)).sort((a, b) => parseInt(a.match(/\d+/)) - parseInt(b.match(/\d+/)));
    const pages = [];
    for (let i = 0; i < slides.length; i++) {
      const d = xml(await z.file(slides[i]).async("string"));
      pages.push({p: i + 1, t: clean(byName(d, "p").map(p => byName(p, "t").map(t => t.textContent).join("")).join("\n"))});
    }
    return {pages, unit: "diapositiva"};
  },
  async xlsx(f) {
    const z = await zip(f);
    const shared = byName(xml(await readText(f, z, "xl/sharedStrings.xml") || "<a/>"), "si").map(si => byName(si, "t").map(t => t.textContent).join(""));
    const wb = xml(await readText(f, z, "xl/workbook.xml") || "<a/>");
    const rels = xml(await readText(f, z, "xl/_rels/workbook.xml.rels") || "<a/>");
    const target = {}; byName(rels, "Relationship").forEach(r => target[r.getAttribute("Id")] = r.getAttribute("Target"));
    const pages = [];
    for (const [i, s] of byName(wb, "sheet").entries()) {
      const rid = s.getAttribute("r:id") || [...s.attributes].find(a => a.localName === "id")?.value;
      let path = (target[rid] || `worksheets/sheet${i + 1}.xml`).replace(/^\/?xl\//, "").replace(/^\//, "");
      const src = await readText(f, z, "xl/" + path); if (!src) continue;
      const rows = byName(xml(src), "row").slice(0, 5000).map(r => byName(r, "c").map(c => {
        const type = c.getAttribute("t"), v = byName(c, "v")[0]?.textContent ?? "";
        if (type === "s") return shared[+v] ?? ""; if (type === "inlineStr") return byName(c, "t").map(t => t.textContent).join("");
        return v;
      }).join("\t").replace(/\t+$/, "")).filter(Boolean);
      if (rows.length) pages.push({p: pages.length + 1, t: `Foglio "${s.getAttribute("name")}"\n` + rows.join("\n")});
    }
    return {pages, unit: "foglio"};
  },
  async odt(f) {
    const d = xml(await readText(f, await zip(f), "content.xml") || "<a/>");
    return chunk(clean([...d.getElementsByTagName("*")].filter(e => e.localName === "p" || e.localName === "h").map(e => e.textContent).join("\n")));
  },
  async odp(f) {
    const d = xml(await readText(f, await zip(f), "content.xml") || "<a/>");
    return {pages: byName(d, "page").map((pg, i) => ({p: i + 1, t: clean(byName(pg, "p").map(e => e.textContent).join("\n"))})), unit: "diapositiva"};
  },
  async ods(f) {
    const d = xml(await readText(f, await zip(f), "content.xml") || "<a/>");
    return {pages: byName(d, "table").map((tb, i) => ({p: i + 1, t: `Foglio "${tb.getAttribute("table:name") || i + 1}"\n` +
      byName(tb, "table-row").map(r => byName(r, "table-cell").map(c => c.textContent).join("\t").replace(/\t+$/, "")).filter(Boolean).join("\n")})), unit: "foglio"};
  },
  async epub(f) {
    const z = await zip(f);
    const container = xml(await readText(f, z, "META-INF/container.xml") || "<a/>");
    const opfPath = byName(container, "rootfile")[0]?.getAttribute("full-path"); if (!opfPath) return null;
    const opf = xml(await readText(f, z, opfPath)), dir = opfPath.includes("/") ? opfPath.replace(/[^/]+$/, "") : "";
    const items = {}; byName(opf, "item").forEach(i => items[i.getAttribute("id")] = i.getAttribute("href"));
    let text = "";
    for (const ref of byName(opf, "itemref")) {
      const src = await readText(f, z, dir + decodeURIComponent(items[ref.getAttribute("idref")] || ""));
      if (src) text += htmlToText(src) + "\n\n";
    }
    return chunk(text);
  },
  async html(f) { return chunk(htmlToText(await f.text())); },
  async text(f) {
    const buf = new Uint8Array(await f.arrayBuffer());
    let t = new TextDecoder("utf-8").decode(buf);
    if ((t.match(/�/g) || []).length > 20) t = new TextDecoder("windows-1252").decode(buf);
    return chunk(t);
  },
  async unknown(f) {
    const head = new Uint8Array(await f.slice(0, 4096).arrayBuffer());
    if (head.includes(0)) return null;
    return extractors.text(f);
  },
};
function toBase64(blob) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1] || ""); r.onerror = () => rej(new Error("File non leggibile")); r.readAsDataURL(blob); });
}
async function toJpeg(f) {
  const bmp = await createImageBitmap(f), c = document.createElement("canvas");
  const s = Math.min(1, 3000 / Math.max(bmp.width, bmp.height));
  c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.9));
  return new File([blob], f.name.replace(/\.[^.]+$/, "") + ".jpg", {type: "image/jpeg"});
}
// Prepara un documento per il server: testo estratto qui, oppure lettura con AI o conversione su Drive.
async function prepare(file, step) {
  const kind = kindOf(file);
  let f = file, mime = mimeOf(file), result = null;
  if (kind === "image" && !GEMINI_IMAGES.includes(mime)) {
    try { f = await toJpeg(file); mime = "image/jpeg"; } catch (e) { throw new Error("immagine in un formato non leggibile: salvala come JPG o PNG"); }
  }
  if (extractors[kind]) {
    step("lettura…");
    try { result = await extractors[kind](f, step); } catch (e) { if (/password/.test(e.message)) throw e; result = null; }
    if (result && !result.pages.some(p => p.t)) result = null;
  }
  let mode = "text";
  if (!result) mode = ["pdf", "image", "audio", "video"].includes(kind) ? "ai" : "convert";
  if (mode !== "text" && f.size > MAX_UPLOAD) throw new Error("troppo grande per essere letto (massimo 20 MB)");
  step(mode === "ai" ? "lettura con AI…" : mode === "convert" ? "conversione…" : "caricamento…");
  const b64 = f.size <= MAX_UPLOAD ? await toBase64(f) : null;
  return {name: f.name, mime, b64, mode, pages: result ? result.pages : null, unit: result ? result.unit : "p", total: result && result.total ? result.total : 0};
}
async function uploadFiles(aid, files, rows, progress) {
  let ok = 0;
  for (let i = 0; i < files.length; i++) {
    const f = files[i], status = rows[i].querySelector(".s");
    try {
      const info = await prepare(f, s => { status.textContent = s; progress.textContent = `${f.name}: ${s}`; });
      if (info.mode !== "text") progress.textContent = `${f.name}: ${info.mode === "ai" ? "Gemini sta leggendo il file (può volerci un minuto)…" : "conversione con Google Drive…"}`;
      const res = await run("addDocument", aid, info);
      const saved = res.archivi.find(a => a.id === aid).files.slice(-1)[0];
      ok++;
      rows[i].className = saved.chars < 30 ? "warn" : "";
      status.textContent = `${saved.pages} ${saved.unit === "p" ? "pag." : saved.unit === "foglio" ? "fogli" : saved.unit === "diapositiva" ? "slide" : "parti"}${saved.note ? " · " + saved.note : ""}${saved.chars < 30 ? " · poco testo" : ""}${saved.id ? "" : " · solo testo"} ✓`;
    } catch (e) {
      rows[i].className = "bad"; status.textContent = e.message;
    }
  }
  return ok;
}

function renderTabs() {
  tabs.innerHTML = "";
  const add = (id, label, cls) => {
    const b = el("button", {role: "tab", "aria-selected": String(current === id), type: "button", class: cls || ""}, label);
    b.title = label; b.onclick = () => { if (!busy) select(id); };
    tabs.appendChild(b);
    if (current === id) setTimeout(() => b.scrollIntoView({block: "nearest", inline: "nearest"}), 0);
  };
  add(NEW, "+ Nuovo archivio", "new");
  for (const a of archives) add(a.id, a.name);
}
function select(id) {
  current = id === SETTINGS || archives.some(a => a.id === id) ? id : NEW;
  if (current !== SETTINGS) store.set("archivi-scheda", current);
  render();
}
function render() {
  renderTabs();
  gear.setAttribute("aria-pressed", String(current === SETTINGS));
  view.innerHTML = "";
  const a = archives.find(x => x.id === current);
  if (current === SETTINGS) renderSettings(); else if (a) renderArchive(a); else renderNew();
}
gear.onclick = () => { if (!busy) select(current === SETTINGS ? (store.get("archivi-scheda") || NEW) : SETTINGS); };

function fileRow(name, status, extra) {
  const li = el("li"), n = el("span", {class: "n"});
  if (extra && extra.href) n.appendChild(el("a", {href: extra.href, target: "_blank", rel: "noopener"}, name)); else n.textContent = name;
  li.append(n, el("span", {class: "s"}, status));
  if (extra && extra.onRemove) {
    const x = el("button", {class: "x", type: "button", "aria-label": "Togli " + name, title: "Togli"}, "×");
    x.onclick = extra.onRemove; li.appendChild(x);
  }
  return li;
}
function dropZone(onFiles, title) {
  const wrap = el("div");
  const label = el("label", {class: "drop"});
  const input = el("input", {type: "file", multiple: "", hidden: ""});
  label.innerHTML = `<strong>${title}</strong> oppure trascinali qui<div class="types">PDF, Word, Excel, PowerPoint, foto e immagini, testo, pagine web, ePub, OpenDocument, audio e video</div>`;
  label.appendChild(input);
  input.onchange = () => { onFiles([...input.files]); input.value = ""; };
  label.ondragover = e => { e.preventDefault(); label.classList.add("over"); };
  label.ondragleave = () => label.classList.remove("over");
  label.ondrop = e => { e.preventDefault(); label.classList.remove("over"); onFiles([...e.dataTransfer.files]); };
  const cam = el("label", {class: "camera"}, "📷 Scatta una foto");
  const camInput = el("input", {type: "file", accept: "image/*", capture: "environment", hidden: ""});
  camInput.onchange = () => {
    const files = [...camInput.files].map(f => /^image\.|^IMG_/i.test(f.name) || !f.name ? new File([f], `Foto ${new Date().toLocaleString("it-IT").replace(/[/:]/g, "-")}.${EXT(f.name) || "jpg"}`, {type: f.type}) : f);
    onFiles(files); camInput.value = "";
  };
  cam.appendChild(camInput);
  wrap.append(label, cam);
  return wrap;
}

function renderNew() {
  const wrap = el("div", {class: "scroll"}), card = el("section", {class: "card"});
  card.innerHTML = `<h2>Nuovo archivio</h2><p class="muted">Dai un nome all'argomento e carica uno o più documenti: diventeranno la base da cui l'AI prende le risposte.</p>
    <label class="field" for="name">Nome dell'archivio</label>
    <input type="text" id="name" maxlength="60" placeholder="Es. Caldaia, Auto, Contratto affitto" autocomplete="off">
    <label class="field">Documenti</label>`;
  const list = el("ul", {class: "files"}), progress = el("p", {class: "progress", "aria-live": "polite"});
  const create = el("button", {class: "primary", type: "button"}, "Crea archivio");
  const drawList = () => {
    list.innerHTML = "";
    picked.forEach((f, i) => list.appendChild(fileRow(f.name, size(f.size), {onRemove: () => { if (!busy) { picked.splice(i, 1); drawList(); } }})));
  };
  card.appendChild(dropZone(files => {
    for (const f of files) if (!picked.some(p => p.name === f.name && p.size === f.size)) picked.push(f);
    drawList();
  }, "Scegli i file"));
  card.append(list);
  const row = el("div", {class: "row"}); row.appendChild(create); card.append(row, progress);
  drawList();
  create.onclick = async () => {
    const name = card.querySelector("#name").value.trim();
    if (!name) { progress.textContent = "Scrivi il nome dell'archivio."; card.querySelector("#name").focus(); return; }
    if (!picked.length) { progress.textContent = "Aggiungi almeno un documento."; return; }
    busy = true; create.disabled = true; progress.textContent = "Creo l'archivio…";
    try {
      const {id} = await run("createArchive", name);
      renderTabs();
      const rows = [...list.children]; rows.forEach(r => r.querySelector(".x")?.remove());
      const ok = await uploadFiles(id, picked, rows, progress);
      busy = false;
      if (ok === picked.length) { picked = []; select(id); return; }
      progress.textContent = ok ? `Archivio creato con ${ok} documenti su ${picked.length}. Gli altri non sono stati caricati.` :
        "Archivio creato, ma nessun documento è stato caricato. Aprilo e riprova ad aggiungerli.";
      picked = [];
      const open = el("button", {class: "btn", type: "button"}, "Apri l'archivio"); open.onclick = () => select(id);
      row.replaceChildren(open);
    } catch (e) { progress.textContent = e.message; create.disabled = false; busy = false; }
  };
  const locked = el("div", {class: "locked"});
  locked.innerHTML = "<strong>Domande e risposte</strong>Dopo aver creato l'archivio si apre la sua scheda: lì potrai fare domande sui documenti caricati.";
  wrap.append(card, locked);
  view.appendChild(wrap);
}

function unitText(f, n) { return f.unit === "p" ? `p.${n}` : `${UNIT[f.unit] || "parte "}${n}`; }
function renderArchive(a) {
  const bar = el("section", {class: "archive-bar"});
  bar.appendChild(el("h2", {}, a.name));
  bar.appendChild(el("p", {class: "muted"}, `${a.files.length} ${a.files.length === 1 ? "documento" : "documenti"}`));
  const details = el("details");
  details.open = !a.files.length || store.get("archivi-doc-aperti") === true;
  details.ontoggle = () => store.set("archivi-doc-aperti", details.open);
  details.appendChild(el("summary", {}, "Documenti e impostazioni"));
  const inner = el("div", {class: "inner"}), list = el("ul", {class: "files"});
  for (const f of a.files) {
    const warn = f.chars < 30;
    const units = f.unit === "p" ? "pag." : f.unit === "foglio" ? "fogli" : f.unit === "diapositiva" ? "slide" : "parti";
    const li = fileRow(f.name, `${f.pages} ${units}${f.note ? " · " + f.note : ""}${warn ? " · poco testo" : ""}`, {href: docUrl(f),
      onRemove: async () => {
        if (busy || !confirm(`Togliere «${f.name}» dall'archivio «${a.name}»?`)) return;
        try { await run("removeDocument", a.id, f.key); render(); } catch (e) { alert(e.message); }
      }});
    if (warn) li.className = "warn";
    list.appendChild(li);
  }
  if (!a.files.length) list.appendChild(el("li", {}, "Nessun documento: aggiungine qui sotto."));
  const progress = el("p", {class: "progress", "aria-live": "polite"});
  const drop = dropZone(async files => {
    if (busy || !files.length) return;
    busy = true;
    const rows = files.map(f => { const r = fileRow(f.name, "in attesa"); list.appendChild(r); return r; });
    const ok = await uploadFiles(a.id, files, rows, progress);
    busy = false;
    const msg = ok === files.length ? "" : `${ok} documenti caricati su ${files.length}.`;
    if (ok) { store.set("archivi-doc-aperti", true); render(); if (msg) view.querySelector(".progress").textContent = msg; }
    else progress.textContent = msg;
  }, "Aggiungi documenti");
  const rename = el("div", {class: "rename"});
  const input = el("input", {type: "text", maxlength: "60", "aria-label": "Nome dell'archivio"}); input.value = a.name;
  const save = el("button", {class: "btn", type: "button"}, "Rinomina");
  save.onclick = async () => { try { await run("renameArchive", a.id, input.value); render(); } catch (e) { progress.textContent = e.message; } };
  rename.append(input, save);
  const del = el("button", {class: "btn danger", type: "button"}, "Elimina archivio");
  del.onclick = async () => {
    if (busy || !confirm(`Eliminare l'archivio «${a.name}»? Finirà nel Cestino di Google Drive.`)) return;
    try { await run("deleteArchive", a.id); store.del(chatKey(a.id)); select(NEW); } catch (e) { progress.textContent = e.message; }
  };
  const row = el("div", {class: "row"}); row.appendChild(del);
  inner.append(list, drop, progress, rename, row);
  details.appendChild(inner); bar.appendChild(details);
  view.appendChild(bar);
  renderChat(a);
}

// ---------- chat ----------
function findFile(a, label) {
  const l = label.trim().replace(/\.[a-z0-9]{2,5}$/i, "").toLowerCase();
  const all = a.files.map(f => ({f, k: esc(f.label).toLowerCase()}));
  return (all.find(x => x.k === l) || all.find(x => l && (x.k.includes(l) || l.includes(x.k))) || {}).f;
}
function inline(a, s) {
  return esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/(^|[\s(])\*(?=\S)([^*]+?)\*(?=$|[\s).,;:!?])/g, "$1<em>$2</em>").replace(/\[([^\[\]]+)\]/g, (all, inner) => {
    let last = null; const links = [];
    for (const part of inner.split(/;|,(?=\s*(?:pp?|pag|parte|foglio|slide|diapositiva)\.?\s*\d)/i)) {
      let m = part.match(/^(.*?)[\s,]*\b(?:pp?|pag(?:ina|g)?|parte|foglio|slide|diapositiva)\.?\s*(\d[\d\s,–-]*)$/i), file = null, pages;
      if (m) { file = m[1].trim() ? findFile(a, m[1]) : last; pages = m[2]; }
      else if ((m = part.match(/^\s*(\d[\d\s,–-]*)$/))) { file = last; pages = m[1]; }
      else if (part.trim() && (file = findFile(a, part))) { last = file; continue; }
      if (!file) return all;
      last = file;
      for (const n of pages.split(",")) {
        const page = (n.match(/\d+/) || [])[0]; if (!page) continue;
        const text = `${esc(file.label)} ${unitText(file, n.trim().replace(/\s+/g, ""))}`, url = docUrl(file);
        links.push(url ? `<a class="cite" target="_blank" rel="noopener" href="${url}">${text}</a>` : `<span class="cite">${text}</span>`);
      }
    }
    return links.join(" ");
  });
}
function markdown(a, text) {
  let html = "", list = null;
  const close = () => { if (list) { html += `</${list}>`; list = null; } };
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.trim(); let m;
    if (!line) { close(); continue; }
    if ((m = line.match(/^#{1,6}\s+(.*)/))) { close(); html += `<h3>${inline(a, m[1])}</h3>`; }
    else if ((m = line.match(/^[-*•]\s+(.*)/))) { if (list !== "ul") { close(); html += "<ul>"; list = "ul"; } html += `<li>${inline(a, m[1])}</li>`; }
    else if ((m = line.match(/^\d+[.)]\s+(.*)/))) { if (list !== "ol") { close(); html += "<ol>"; list = "ol"; } html += `<li>${inline(a, m[1])}</li>`; }
    else { close(); html += `<p>${inline(a, line)}</p>`; }
  }
  close(); return html;
}
function renderChat(a) {
  const chat = el("main", {id: "chat", "aria-live": "polite"}), form = el("form", {class: "ask"});
  const q = el("textarea", {rows: "1", maxlength: "2000", placeholder: `Chiedi qualcosa su «${a.name}»…`, "aria-label": "La tua domanda"});
  const send = el("button", {class: "send", type: "submit"}, "Invia");
  form.append(q, send);
  const reset = el("button", {class: "btn", type: "button"}, "Nuova chat");
  view.append(chat, form);
  let history = store.get(chatKey(a.id)) || [];
  const save = () => store.set(chatKey(a.id), history.slice(-40));
  const bubble = (cls, content, isHtml) => {
    const d = el("div", {class: cls});
    if (isHtml) d.innerHTML = content; else d.textContent = content;
    chat.appendChild(d); chat.scrollTop = chat.scrollHeight; return d;
  };
  const addReset = () => { if (history.length && !reset.isConnected) { const r = el("div", {style: "align-self:center"}); r.appendChild(reset); chat.appendChild(r); } };
  const draw = () => {
    chat.innerHTML = "";
    if (!history.length) {
      const w = el("div", {class: "welcome"});
      w.appendChild(el("h3", {}, `Cosa vuoi sapere su «${a.name}»?`));
      w.appendChild(el("p", {}, "Rispondo leggendo i documenti di questo archivio e indico da dove prendo le informazioni: tocca la citazione per aprire il documento."));
      const chips = el("div", {class: "chips"});
      for (const s of (a.name.toLowerCase() === "caldaia" ? CALDAIA_SUGGESTED : SUGGESTED)) { const b = el("button", {type: "button"}, s); b.onclick = () => ask(s); chips.appendChild(b); }
      w.appendChild(chips); chat.appendChild(w);
    } else {
      for (const t of history) t.role === "user" ? bubble("msg user", t.text) : bubble("msg bot", markdown(a, t.text), true);
      addReset();
    }
  };
  async function ask(question) {
    if (busy || !question.trim()) return;
    if (!settings.hasKey) { select(SETTINGS); return; }
    busy = true; send.disabled = true; q.value = ""; q.style.height = "";
    const previous = history.slice(-8);
    chat.querySelector(".welcome")?.remove(); reset.parentNode?.remove();
    bubble("msg user", question);
    const wait = bubble("msg bot wait", "Sto leggendo i documenti…");
    try {
      const text = await run("ask", a.id, question, previous);
      history.push({role: "user", text: question}, {role: "model", text}); save();
      wait.remove(); bubble("msg bot", markdown(a, text), true);
    } catch (e) {
      wait.remove();
      const d = bubble("err", e.message), b = el("button", {type: "button"}, "Riprova");
      b.onclick = () => { d.previousSibling?.remove(); d.remove(); ask(question); }; d.appendChild(b);
    } finally {
      busy = false; send.disabled = false; addReset();
      if (matchMedia("(min-width:700px)").matches) q.focus();
    }
  }
  reset.onclick = () => { if (busy) return; history = []; save(); draw(); };
  form.onsubmit = e => { e.preventDefault(); ask(q.value); };
  q.onkeydown = e => { if (e.key === "Enter" && !e.shiftKey && !matchMedia("(pointer:coarse)").matches) { e.preventDefault(); ask(q.value); } };
  q.oninput = () => { q.style.height = "auto"; q.style.height = q.scrollHeight + 2 + "px"; };
  draw();
}

// Importazione di un archivio inviato dalla vecchia app locale sul PC (solo da localhost).
window.addEventListener("message", async e => {
  if (!/^http:\/\/(localhost|127\.0\.0\.1):80(0\d|10)$/.test(e.origin) || !e.data || !e.data.importa) return;
  const {name, files} = e.data.importa, reply = m => e.source.postMessage({stato: m}, e.origin);
  try {
    let a = archives.find(x => x.name.toLowerCase() === String(name).toLowerCase());
    if (!a) { const r = await run("createArchive", name); a = archives.find(x => x.id === r.id); }
    for (const f of files) {
      if (a.files.some(x => x.name === f.name)) { reply("già presente: " + f.name); continue; }
      reply("carico " + f.name);
      await run("addDocument", a.id, f);
      a = archives.find(x => x.id === a.id);
    }
    reply("fatto"); select(a.id);
  } catch (err) { reply("errore: " + err.message); }
});
try { if (window.top.opener) window.top.opener.postMessage("archivi-ai-pronto", "*"); } catch (e) {}

(async () => {
  try { [settings] = await Promise.all([run("getSettings"), run("listArchives").then(l => { archives = l; })]); }
  catch (e) { view.innerHTML = ""; view.appendChild(el("p", {class: "err", style: "margin:16px"}, e.message)); return; }
  if (!settings.hasKey) { select(SETTINGS); return; }
  const saved = store.get("archivi-scheda");
  select(archives.some(a => a.id === saved) ? saved : (archives[0]?.id || NEW));
})();
})();
